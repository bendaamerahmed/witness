name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Rule copies match AGENTS.md
        run: node scripts/check-rule-copies.js
      - name: Manifest versions agree
        run: node scripts/check-versions.js
      - name: Docs links resolve
        run: node scripts/check-links.js
      - name: Unit and hook integration tests
        # No shell glob: bash expands tests/*.test.js, Windows cmd and PowerShell
        # do not, and node then looks for a file literally named '*.test.js'.
        run: node --test
      - name: Detector precision and recall
        run: node benchmarks/precision.js --gate

      - name: Report formats all render
        run: |
          node -e "
            const r = require('./lib/report');
            const F = [{tell:'moved goalpost',path:'a.py',line:1,evidence:'x -> y'}];
            for (const f of r.FORMATS) {
              const out = r.render(f, F, {filesChanged:1});
              if (!out || out.length < 40) { console.error('empty output for', f); process.exit(1); }
            }
            console.log('all', r.FORMATS.length, 'formats render');
          "

  instrument:
    name: benchmark instrument selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pytest
      # Proves the measurement harness can still tell a real fix from a
      # fixture-fitted one. If this fails, no number this repo publishes is safe.
      - run: python benchmarks/run.py --selftest

  dogfood:
    name: witness scans its own diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./
        with:
          fail-on: ''          # advisory on our own repo too; we take our own advice
          upload-sarif: 'true'

  action-smoke:
    name: action runs end to end
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Scan against the previous commit
        shell: bash
        run: |
          node bin/witness-scan.js --base "${GITHUB_SHA}^" --sarif out.sarif
          # require() infers a loader from the extension and has no idea what
          # .sarif is, so it parsed the JSON as JavaScript.
          node -e "
            const d = JSON.parse(require('fs').readFileSync('out.sarif', 'utf8'));
            if (d.version !== '2.1.0') { console.error('bad sarif version', d.version); process.exit(1); }
            if (!d.runs[0].tool.driver.rules.length) { console.error('no rules declared'); process.exit(1); }
            console.log('sarif ok,', d.runs[0].results.length, 'result(s),', d.runs[0].tool.driver.rules.length, 'rules');
          "
