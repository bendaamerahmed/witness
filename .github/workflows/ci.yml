name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      # Full history: check-links.js resolves the action refs the docs advertise
      # (@v0 and friends), and a shallow checkout has no tags to resolve them against.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Rule copies match AGENTS.md
        run: node scripts/check-rule-copies.js
      - name: Manifest versions agree
        run: node scripts/check-versions.js
      - name: Docs links resolve
        run: node scripts/check-links.js
      - name: Unit and hook integration tests
        # No shell glob: bash expands tests/*.test.js, Windows cmd and PowerShell
        # do not, and node then looks for a file literally named '*.test.js'.
        run: node --test
      - name: Detector precision and recall
        run: node benchmarks/precision.js --gate

      - name: Report formats all render
        run: |
          node -e "
            const r = require('./lib/report');
            const F = [{tell:'moved goalpost',path:'a.py',line:1,evidence:'x -> y'}];
            for (const f of r.FORMATS) {
              const out = r.render(f, F, {filesChanged:1});
              if (!out || out.length < 40) { console.error('empty output for', f); process.exit(1); }
            }
            console.log('all', r.FORMATS.length, 'formats render');
          "

  instrument:
    name: benchmark instrument selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install pytest
      # Proves the measurement harness can still tell a real fix from a
      # fixture-fitted one. If this fails, no number this repo publishes is safe.
      - run: python benchmarks/run.py --selftest

  wild:
    name: precision on real merged commits
    runs-on: ubuntu-latest
    # ~200MB of clones and a few minutes of git, so it does not run on every
    # push. It runs on anything that touches the detector, the grouper or the
    # labels — which is every change that could move the number.
    if: >
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[wild]')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }

      - name: Cache the pinned clones
        uses: actions/cache@v6
        with:
          path: benchmarks/.wild-repos
          # The pins file is the cache identity: re-pin, re-clone.
          key: wild-repos-${{ hashFiles('benchmarks/wild-pins.json') }}

      - run: npm run wild:clone

      # Blob-filtered clones fetch lazily, and the pins are older than HEAD, so
      # the objects the sweep needs are only guaranteed after a fetch.
      - name: Make sure the pinned commits are present
        run: |
          set -euo pipefail
          for r in requests flask got express gin; do
            git -C "benchmarks/.wild-repos/$r" fetch --quiet origin || true
          done

      - name: Sweep and score against the hand-labels
        run: node benchmarks/wild-precision.js --gate

      - name: Publish the numbers to the run summary
        if: always()
        run: |
          {
            echo '### Precision on real merged commits'
            echo
            echo '```'
            node benchmarks/wild-precision.js || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dogfood:
    name: witness scans its own diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - uses: ./
        with:
          fail-on: ''          # advisory on our own repo too; we take our own advice
          # Dependabot's pull requests run with a read-only GITHUB_TOKEN no
          # matter what `permissions:` says, so uploading SARIF fails them with
          # "Resource not accessible by integration". The scan itself still runs
          # and still writes the job summary; only the code-scanning upload is
          # skipped, and skipping it is the correct behaviour rather than a
          # workaround.
          upload-sarif: ${{ github.actor != 'dependabot[bot]' }}

  action-smoke:
    name: action runs end to end
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - name: Scan against the previous commit
        shell: bash
        run: |
          node bin/witness-scan.js --base "${GITHUB_SHA}^" --sarif out.sarif
          # require() infers a loader from the extension and has no idea what
          # .sarif is, so it parsed the JSON as JavaScript.
          node -e "
            const d = JSON.parse(require('fs').readFileSync('out.sarif', 'utf8'));
            if (d.version !== '2.1.0') { console.error('bad sarif version', d.version); process.exit(1); }
            if (!d.runs[0].tool.driver.rules.length) { console.error('no rules declared'); process.exit(1); }
            console.log('sarif ok,', d.runs[0].results.length, 'result(s),', d.runs[0].tool.driver.rules.length, 'rules');
          "
