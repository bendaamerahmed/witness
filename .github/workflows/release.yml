name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Verify and package, but do not publish or create a release'
        type: boolean
        default: true

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC). Without it npm reports a
  # misleading 404/ENEEDAUTH rather than an auth error. See npm/cli#9088.
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: pip install pytest
      # check-versions.js asserts the tag equals the version in all five
      # manifests, so a mistagged release cannot reach the registry.
      - run: npm run verify
      - run: python benchmarks/run.py --selftest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. setup-node
      # ships an older npm even on Node 22, so it is upgraded explicitly.
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm install -g npm@latest
      - run: npm --version

      - name: What is on the registry already
        id: state
        run: |
          set -uo pipefail
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "pkg=$PKG"  >> "$GITHUB_OUTPUT"
          echo "ver=$VER"  >> "$GITHUB_OUTPUT"

          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "state=version-exists" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$VER is already on the registry; publish will be skipped."
          elif npm view "$PKG" version >/dev/null 2>&1; then
            echo "state=package-exists" >> "$GITHUB_OUTPUT"
          else
            echo "state=new-package" >> "$GITHUB_OUTPUT"
          fi

      # OIDC cannot CREATE a package: a trusted publisher is configured on a
      # package that already exists (npm/cli#8544, open). So the first publish
      # needs a token, and only the first. NPM_TOKEN is optional and unused once
      # the package exists — if it is absent, this step explains what to do
      # rather than failing with a 404.
      - name: Publish
        id: publish
        if: steps.state.outputs.state != 'version-exists' && !inputs.dry-run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -uo pipefail
          STATE="${{ steps.state.outputs.state }}"
          PKG="${{ steps.state.outputs.pkg }}"

          if [ "$STATE" = "new-package" ]; then
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::warning::$PKG does not exist on the registry yet, and OIDC cannot create it."
              echo "::warning::Either publish once locally (npm publish --provenance=false), or add an NPM_TOKEN secret for the bootstrap."
              echo "published=skipped-no-bootstrap" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Bootstrapping $PKG with NPM_TOKEN. Configure the trusted publisher afterwards; later releases use OIDC."
            npm config set "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
          fi

          # The exit status is carried past the token cleanup and re-raised at
          # the end. Reporting the failure only through an output variable left
          # this job green, and `release` needs: publish — so a GitHub release
          # was cut for a version that never reached the registry. A publish
          # that silently did nothing while the pipeline went green is the
          # exact shape this project exists to find.
          if npm publish; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            STATUS=0
          else
            echo "::error::npm publish failed. 404 or ENEEDAUTH is usually the trusted publisher config: the workflow filename field must be release.yml, not a path. E422 'Unsupported GitHub Actions source repository visibility' means the repository is private, and provenance requires a public one."
            echo "published=false" >> "$GITHUB_OUTPUT"
            STATUS=1
          fi
          npm config delete "//registry.npmjs.org/:_authToken" || true
          exit "$STATUS"

      # A publish that silently did nothing is the failure mode this whole
      # project is about, so the result is checked against the registry rather
      # than trusted from the exit code.
      - name: Confirm it is actually on the registry
        if: steps.publish.outputs.published == 'true'
        run: |
          set -uo pipefail
          PKG="${{ steps.state.outputs.pkg }}"; VER="${{ steps.state.outputs.ver }}"
          for i in 1 2 3 4 5 6; do
            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "::notice::$PKG@$VER confirmed on the registry."
              # Ask the registry for the one field, rather than parsing the whole
              # packument: `npm view <spec> --json` does not always return a single
              # object, so `d.dist.attestations` threw a TypeError that `|| true`
              # swallowed — and the provenance line never printed at all on the
              # release that first carried provenance.
              ATT=$(npm view "$PKG@$VER" dist.attestations.provenance.predicateType 2>/dev/null || true)
              if [ -n "$ATT" ]; then
                echo "::notice::provenance: yes ($ATT)"
              else
                echo "::warning::provenance: no attestation on $PKG@$VER (published with a token, not OIDC)"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Published, but $PKG@$VER is not resolving yet. Registry propagation can lag; check manually."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release ${{ github.ref_name }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| package | \`${{ steps.state.outputs.pkg }}@${{ steps.state.outputs.ver }}\` |"
            echo "| registry state | ${{ steps.state.outputs.state }} |"
            echo "| published | ${{ steps.publish.outputs.published || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package the plugin
        run: |
          zip -r "witness-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' 'node_modules/*' 'benchmarks/runs/*' 'benchmarks/.wild-repos/*'
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: witness-*.zip
          body_path: .github/RELEASE_PREAMBLE.md
