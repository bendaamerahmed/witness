description = "Sweep the repo for standing check debt"
prompt = "Sweep this repository {{args}} for accumulated check debt. Respect .gitignore, skip node_modules, vendor, dist, build, .venv, __pycache__, lockfiles and generated files. Count first, list second. Categories in order: disabled gates (continue-on-error, || true on a test command, lowered coverage thresholds, a linter dropped from CI); skipped tests (.skip, xit, @pytest.mark.skip, xfail, #[ignore], t.Skip(), and .only which silently skips everything else); swallowed errors (empty catch/except, rescue nil, discarded error returns); type and lint suppressions (@ts-ignore, # type: ignore, # noqa, #[allow], //nolint, @SuppressWarnings, and whole-file variants which count for ten); coverage exclusions (pragma: no cover, istanbul ignore, coverage omit entries). Lead with the silence budget as a count table, then the ranked list capped at 25. Use git log -S or git blame for age. Density matters more than count. Close with the single one to remove first, pick exactly one. Every item may be legitimate: report what is silenced, do not claim the silence is wrong."
