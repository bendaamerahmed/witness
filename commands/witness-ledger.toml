description = "List the declared witness: exceptions"
prompt = "Collect every 'witness:' marker in this repository {{args}} into one ledger. For each: file, line, the tell it sits on, the stated reason, and the age from git blame. Flag three problems: empty (no substantive reason, 'witness: needed' is not a reason), stale (references an issue, ticket or version that is closed, merged or long past), orphaned (no longer next to anything it could explain). Output the count, then each entry, then the problem counts. Close with the oldest declared exception and whether its reason still holds. The number to watch is the ratio of declared to undeclared from /witness-audit, not the total. Do not remove markers or rewrite reasons."
