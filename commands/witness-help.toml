description = "Witness quick reference"
prompt = "Show the witness reference card {{args}}. A green check is not evidence, it is a claim. Commands: /witness [lite|full|ultra|off] sets the session level; /witness default <level> sets what new sessions start in; /witness-proof produces the evidence block; /witness-scan scans the working diff; /witness-audit sweeps the repo for standing check debt; /witness-ledger lists declared exceptions; /witness-gain shows the benchmark numbers; /witness-help is this card. Chain of custody: reproduce, locate, repair, re-run, widen. The seven tells: softened assertion, suppression, skip, swallow, no-op fix, fixture fitting, moved goalpost. The marker: '# witness: <reason>' declares an exception on purpose. Levels: lite (bug fixes only), full (default), ultra (nothing reported as working without a pasted command and its real output), off. Config: WITNESS_DEFAULT_MODE, WITNESS_GUARD=0 to disable diff inspection, WITNESS_SUBAGENT_MATCHER, WITNESS_HIDE_STATUS, or ~/.config/witness/config.json (%APPDATA%\\witness\\config.json on Windows). Every hook is advisory: never blocks a tool call, never reverts an edit, never refuses to finish."
