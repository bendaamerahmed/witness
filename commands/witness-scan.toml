description = "Scan the working diff for the seven tells"
prompt = "Scan the working diff {{args}} for the seven ways a green check lies. Get the diff (git diff, or git diff --cached, or git diff <base>...HEAD). Walk only ADDED lines. Report: softened assertion (a strict comparison removed and a loose one added: assertEqual to assertTrue, toEqual to toBeTruthy, exact to contains, widened tolerance); suppression (@ts-ignore, eslint-disable, # noqa, # type: ignore, #[allow(...)], pragma: no cover, @SuppressWarnings, //nolint, --no-verify, continue-on-error: true, || true); skip (.skip, .only, xit, @pytest.mark.skip, xfail, t.Skip(), #[ignore], a deleted test); swallow (catch {}, except: pass, rescue nil, _ = err, empty .catch(), a default standing in for an error); no-op fix (only test/config files changed, no source, described as a fix); fixture fitting (a new branch or constant matching exactly the test input); moved goalpost (an assertion with identical structure and strictness asking about a different input, or expecting a different answer than before: 'assert fmt(1000) == \"1000\"' becoming 'assert fmt(100) == \"100\"'). Moved goalpost is the most common in practice and the hardest to see, rank it second after no-op fix. A line carrying 'witness:' on or adjacent to it is a declared exception, list it separately. Output one line per finding: <file>:<line> <tell> <what changed> -> <the ask>. Rank by how much it hides: no-op fix, softened assertion, swallow, skip, suppression, fixture fitting. If the diff is clean, say so in one line and stop. Report what is visible, never infer intent."
