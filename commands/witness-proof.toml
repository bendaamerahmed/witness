description = "Produce the evidence block for a change"
prompt = "Produce the evidence for this change {{args}}, not a report about it. Walk the chain of custody and output exactly: repro: <command> -> <the failure, quoted>; cause: <file:line> <one sentence>; fix: <file:line> checks unchanged; proof: <same command> -> <the pass, quoted>; widen: <extra case> -> <result>. Every line is either real output or the sentence 'I did not run this'. Never a paraphrase, never a prediction. If a check was modified, lead with that instead: CHECK CHANGED, was/now/why, and proof that the new check fails against the pre-fix code. A new check that never failed against the bug proves nothing."
